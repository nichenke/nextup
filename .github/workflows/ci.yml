name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, and before any install: the guard needs no dependencies, and a leaked
      # identifier must fail the build even when the toolchain is broken. Ordering it
      # after `bun install` once meant a failing install stopped it from ever running,
      # on a commit that had a private registry host in its lockfile.
      - run: bash scripts/check-identifiers.sh

      # The pin is what stops a lockfile recording whatever mirror a machine resolves through, which
      # is the mechanism that actually leaked -- guarding it is worth more than recognising the text
      # it would produce. See ADR-0006.
      #
      # Compares the table each registry key sits under, not just the key's text. Two earlier versions
      # matched the line alone and passed on a file that pinned nothing: the public line in the root
      # table, or under `[test]`, or under `[install.scopes]`, with `[install]` left unpinned or set to
      # a mirror. Emitting `<table>|<line>` for every registry assignment and comparing the whole
      # output literally makes a missing, misplaced, scoped, duplicated or altered key all fail, with
      # no TOML parser -- a duplicate emits a second line, so the comparison catches it too.
      - name: Assert the registry pin
        run: |
          test "$(awk '/^[[:space:]]*\[/ { table = $0 } /^[[:space:]]*registry[[:space:]]*=/ { print table "|" $0 }' bunfig.toml)" \
            = '[install]|registry = "https://registry.npmjs.org"'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - run: bun test
