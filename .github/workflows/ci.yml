name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, and before any install: the guard needs no dependencies, and a leaked
      # identifier must fail the build even when the toolchain is broken. Ordering it
      # after `bun install` once meant a failing install stopped it from ever running,
      # on a commit that had a private registry host in its lockfile.
      - run: bash scripts/check-identifiers.sh

      # The pin is what stops a lockfile recording whatever mirror a machine resolves through, which
      # is the mechanism that actually leaked -- guarding it is worth more than recognising the text
      # it would produce. See ADR-0006.
      #
      # Two assertions rather than one, because grep is not TOML-aware: the public line can sit in the
      # root table while `[install]` sets a private mirror, and a lone grep for the line passes while
      # bun reads the mirror. Requiring it to be the file's *only* registry assignment removes the
      # place a second value could hide, without parsing the file.
      - name: Assert the registry pin
        run: |
          test "$(grep -c '^[[:space:]]*registry[[:space:]]*=' bunfig.toml)" = 1
          grep -qxF 'registry = "https://registry.npmjs.org"' bunfig.toml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - run: bun test
